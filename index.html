<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- このアプリは独自の配色テーマ（ダーク含む）を持っているため、
     Dark Reader などの拡張機能による自動反転を辞退する。
     拡張機能が対応していない場合に備え、下の CSS でも配色を明示している。 -->
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<title>ホワイトボード</title>
<!--
  設計メモ（file:// で直接開く前提のため守っている制約）
  - <script type="module"> は使わない（file:// では CORS でブロックされる）
  - 外部 CDN からフォント・ライブラリを取得しない（file:// では取得できない）
  - localStorage に依存しない（file: URL では挙動が仕様上未定義）
  - 保存はダウンロード方式を基本形とし、HTTPS + Chromium のときだけ
    File System Access API による上書き保存を機能検出で上乗せする

  第2段階での設計変更：
  手書きストロークを canvas から SVG <path> に移した。canvas は SVG の下に
  固定されるため、手書きと文字の重なり順を混在させられず、SVG 書き出しにも
  含められなかったのが理由。手書きは補助用途で本数が限られる前提のため、
  DOM ノード数の増加より重なり順と書き出しの一貫性を優先している。
-->
<style>
:root{
  --ink-900:#151d1c;
  --ink-800:#1d2827;
  --ink-700:#2a3836;
  --paper:#f6f7f5;
  --accent:#1f6f63;
  --accent-soft:#e2efeb;
  --warn:#a2560f;
  --chrome-fg:#e6ecea;
  --grid:#c9d2ce;
  --ui: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--ui); color:var(--ink-900); background:var(--ink-900);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  color-scheme:dark;          /* 上下バーは常に暗色なので、標準部品もそれに合わせる */
}
#app{ display:flex; flex-direction:column; height:100%; }

/* ── 上部バー ───────────────────────────── */
.bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:7px 12px; background:var(--ink-800); color:var(--chrome-fg);
  border-bottom:1px solid #000;
}
/* 書式パネルはキャンバス上に浮かせる。上下バーの高さを変えると、
   ドラッグ中にキャンバスの原点が動いて図形がずれるため。 */
#props{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%);
  z-index:5; max-width:calc(100% - 24px);
  background:var(--ink-800); border:1px solid #000; border-radius:10px;
  padding:6px 10px; box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#props[hidden]{ display:none; }

#ctxmenu{
  position:absolute; z-index:8; min-width:132px; padding:4px;
  background:var(--ink-800); color:var(--chrome-fg);
  border:1px solid #000; border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:flex; flex-direction:column; gap:1px;
}
#ctxmenu[hidden]{ display:none; }
#ctxmenu .chead{
  font-size:10.5px; opacity:.5; padding:4px 8px 5px; letter-spacing:.06em;
}
#ctxmenu button{
  text-align:left; padding:6px 10px; font-size:12.5px; border-radius:5px;
}
#ctxmenu button:hover{ background:var(--accent); color:#fff; }

#layers{
  position:absolute; right:14px; top:14px; z-index:6; width:230px;
  background:var(--ink-800); color:var(--chrome-fg); font-size:12.5px;
  border:1px solid #000; border-radius:10px; overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#layers[hidden]{ display:none; }
#layers .lhead{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 10px; background:var(--ink-700); font-weight:600; letter-spacing:.04em;
}
#layers .lhead button{ padding:2px 8px; font-size:15px; line-height:1; }
#layerList{ max-height:280px; overflow:auto; }
#layers .lrow{
  display:flex; align-items:center; gap:6px; padding:5px 8px;
  border-top:1px solid #33403e; cursor:pointer;
}
#layers .lrow.on{ background:var(--accent); }
#layers .lrow.on .lcnt{ opacity:.9; }
#layers .lnm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#layers .lcnt{ font-family:var(--mono); font-size:10.5px; opacity:.55; }
#layers .ltog{
  font-size:10.5px; padding:2px 6px; border-radius:4px;
  background:rgba(255,255,255,.08); white-space:nowrap;
}
#layers .ltog[aria-pressed="false"]{ opacity:.45; }
#layers .lfoot{ display:flex; gap:2px; padding:6px; background:var(--ink-700); flex-wrap:wrap; }
#layers .lfoot button{ font-size:11.5px; padding:5px 7px; background:rgba(255,255,255,.07); }
#layers input.rename{
  flex:1; min-width:0; font-family:var(--ui); font-size:12.5px;
  color:var(--chrome-fg); background:var(--ink-900);
  border:1px solid var(--accent); border-radius:4px; padding:2px 5px;
}

#restore{
  position:absolute; left:50%; top:14px; transform:translateX(-50%); z-index:6;
  display:flex; align-items:center; gap:8px;
  background:var(--ink-800); color:var(--chrome-fg); font-size:12.5px;
  border:1px solid #000; border-radius:10px; padding:7px 10px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#restore[hidden]{ display:none; }
#restore button{ background:var(--ink-700); }
#restore #btnRestore{ background:var(--accent); }
.brand{ font-size:13px; font-weight:650; letter-spacing:.14em; opacity:.75; white-space:nowrap; }
.group{ display:flex; align-items:center; gap:2px; background:var(--ink-700); padding:2px; border-radius:7px; }
#props .group{ background:rgba(0,0,0,.22); }
.group[hidden]{ display:none; }
.sep{ width:1px; height:22px; background:#3a4a47; }
.tag{ font-size:11px; opacity:.6; padding:0 6px 0 2px; white-space:nowrap; }

button{
  font-family:var(--ui); font-size:12.5px; color:var(--chrome-fg);
  background:transparent; border:0; border-radius:5px;
  padding:6px 10px; cursor:pointer; line-height:1.2; white-space:nowrap;
}
button:hover{ background:#3a4a47; }
button:focus-visible{ outline:2px solid var(--accent-soft); outline-offset:1px; }
button[aria-pressed="true"]{ background:var(--accent); color:#fff; }
button[disabled]{ opacity:.35; cursor:default; }
button[disabled]:hover{ background:transparent; }
button .k{ opacity:.55; font-family:var(--mono); font-size:10.5px; margin-left:5px; }

/* 背景を transparent にしておくと、開いた一覧の地色が環境任せになり、
   明るい地に明るい文字が重なって読めなくなることがある。
   地色と文字色を両方とも明示しておく。 */
select{
  font-family:var(--ui); font-size:12.5px;
  color:var(--chrome-fg);
  background-color:var(--ink-900);
  border:1px solid #465653; border-radius:5px;
  padding:5px 6px; cursor:pointer;
  color-scheme:dark;
}
select:focus-visible{ outline:2px solid var(--accent-soft); outline-offset:1px; }
select option,
select optgroup{
  background-color:var(--ink-900);
  color:var(--chrome-fg);
}

.sw{
  width:22px; height:22px; padding:0; border-radius:5px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
}
.sw:hover{ background:transparent; box-shadow:inset 0 0 0 1px rgba(255,255,255,.6); }
.sw[aria-pressed="true"]{ box-shadow:inset 0 0 0 2px #fff, 0 0 0 2px var(--accent); }
.sw.none{ background-image:linear-gradient(135deg,transparent 44%,var(--warn) 44%,var(--warn) 56%,transparent 56%); }

/* ── キャンバス ───────────────────────────── */
#wrap{
  position:relative; flex:1; overflow:hidden;
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--grid) 1px, transparent 1.2px);
  cursor:default; touch-action:none;
}
#wrap.panning{ cursor:grabbing; }
#wrap.pannable{ cursor:grab; }
#wrap.drawing, #wrap.placing{ cursor:crosshair; }
#wrap.linking{ cursor:crosshair; }
#scene{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#scene .hit{ pointer-events:auto; }

#editor{
  position:absolute; display:none; margin:0; padding:0; border:0; outline:0;
  resize:none; overflow:hidden; background:transparent; color:inherit;
  font-family:var(--ui); box-shadow:0 0 0 1.5px var(--accent); border-radius:2px;
}

/* ── ステータスバー ──────────────────────── */
#status{
  display:flex; align-items:center; background:var(--ink-800); color:var(--chrome-fg);
  font-family:var(--mono); font-size:11px; border-top:1px solid #000; min-height:26px;
}
#status .cell{ padding:5px 12px; border-right:1px solid #33403e; opacity:.8; white-space:nowrap; }
#status .cell:last-child{ border-right:0; }
#status .cell.hint{ opacity:.5; overflow:hidden; text-overflow:ellipsis; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
.dot.on{ background:var(--accent); } .dot.off{ background:var(--warn); }
.dot.dirty{ background:var(--warn); } .dot.clean{ background:#4a5b58; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
@media (max-width:760px){ .brand{ display:none; } #status .cell.hint{ display:none; } }
</style>
</head>
<body>
<div id="app">

  <div class="bar" id="toolbar">
    <span class="brand">WHITEBOARD</span>

    <div class="group" role="group" aria-label="ツール">
      <button data-tool="select" aria-pressed="true">選択<span class="k">V</span></button>
      <button data-tool="text"   aria-pressed="false">文字<span class="k">T</span></button>
      <button data-tool="note"   aria-pressed="false">付箋<span class="k">N</span></button>
      <button data-tool="rect"   aria-pressed="false">枠<span class="k">R</span></button>
      <button data-tool="line"   aria-pressed="false">直線<span class="k">L</span></button>
      <button data-tool="arrow"  aria-pressed="false">矢印<span class="k">A</span></button>
      <button data-tool="pen"    aria-pressed="false">手書き<span class="k">P</span></button>
      <button data-tool="frame"  aria-pressed="false">フレーム<span class="k">F</span></button>
    </div>

    <div class="sep"></div>
    <div class="group">
      <button id="btnUndo" disabled>元に戻す<span class="k">^Z</span></button>
      <button id="btnRedo" disabled>やり直す<span class="k">^Y</span></button>
    </div>

    <div class="sep"></div>
    <div class="group">
      <button id="btnZoomOut">−</button>
      <button id="btnZoomReset">100%</button>
      <button id="btnZoomIn">＋</button>
      <button id="btnFit">全体を表示</button>
    </div>

    <div class="sep"></div>
    <div class="group">
      <span class="tag">グリッド</span>
      <select id="selGrid" title="グリッドの間隔">
        <option value="0">なし</option>
        <option value="8">8</option>
        <option value="16">16</option>
        <option value="24" selected>24</option>
        <option value="40">40</option>
        <option value="80">80</option>
      </select>
      <button id="btnSnap" aria-pressed="false" title="移動・作成・大きさ変更をグリッドにそろえる">吸着</button>
      <button id="btnGuide" aria-pressed="true" title="他の図形との位置ぞろえ・等間隔をドラッグ中に案内する">ガイド</button>
    </div>

    <div class="group">
      <button id="btnLayers" aria-pressed="false">レイヤー</button>
    </div>

    <div class="group">
      <span class="tag">テーマ</span>
      <select id="selTheme" title="配色テーマ（保存ファイルに記録されます）">
        <option value="forest" selected>深緑</option>
        <option value="dark">ダーク</option>
        <option value="blueprint">製図</option>
        <option value="washi">和紙</option>
      </select>
    </div>

    <div class="sep"></div>
    <div class="group">
      <button id="btnOpen">開く<span class="k">^O</span></button>
      <button id="btnSave">保存<span class="k">^S</span></button>
      <button id="btnSaveAs">名前を付けて保存</button>
    </div>

    <div class="group">
      <span class="tag">書き出し</span>
      <select id="selScope" title="書き出す範囲">
        <option value="all" selected>全体</option>
        <option value="sel">選択範囲</option>
        <option value="frame">フレーム</option>
      </select>
      <button id="btnExportSvg">SVG</button>
      <button id="btnExportPng">PNG</button>
    </div>
  </div>


  <div id="wrap">
    <svg id="scene" xmlns="http://www.w3.org/2000/svg">
      <g id="world"></g>
      <g id="sel"></g>
      <g id="anchors"></g>
      <g id="guides"></g>
    </svg>
    <textarea id="editor" spellcheck="false"></textarea>

    <div id="ctxmenu" hidden>
      <div class="chead">ここに挿入</div>
      <button data-ins="text">文字</button>
      <button data-ins="note">付箋</button>
      <button data-ins="rect">枠</button>
      <button data-ins="line">直線</button>
      <button data-ins="arrow">矢印</button>
      <button data-ins="frame">フレーム</button>
    </div>

    <div id="layers" hidden>
      <div class="lhead"><span>レイヤー</span><button id="btnLayerAdd" title="レイヤーを追加">＋</button></div>
      <div id="layerList"></div>
      <div class="lfoot">
        <button id="btnLayerUp" title="ひとつ前面へ">上へ</button>
        <button id="btnLayerDown" title="ひとつ背面へ">下へ</button>
        <button id="btnLayerMove" title="選択中の図形を、いま選んでいるレイヤーへ移す">選択を移動</button>
        <button id="btnLayerDel" title="レイヤーと、その中の図形を削除">削除</button>
      </div>
    </div>

    <div id="restore" hidden>
      <span>前回の自動バックアップ（<b id="restoreWhen"></b>）があります。</span>
      <button id="btnRestore">復元する</button>
      <button id="btnDismiss">閉じる</button>
    </div>
  <div class="bar" id="props" hidden>
    <div class="group" id="grpSize">
      <span class="tag">文字サイズ</span>
      <select id="selSize">
        <option value="14">14</option><option value="18" selected>18</option>
        <option value="24">24</option><option value="32">32</option><option value="48">48</option>
      </select>
    </div>

    <div class="group" id="grpColor"><span class="tag">文字・線の色</span></div>
    <div class="group" id="grpFill"><span class="tag">塗り</span></div>

    <div class="group" id="grpWidth">
      <span class="tag">線の太さ</span>
      <select id="selWidth">
        <option value="1.5">細</option><option value="2.5" selected>中</option>
        <option value="4">太</option><option value="7">極太</option>
      </select>
    </div>

    <div class="group" id="grpArrow">
      <span class="tag">矢じり</span>
      <select id="selArrow">
        <option value="none">なし</option>
        <option value="end" selected>先端</option>
        <option value="both">両端</option>
      </select>
    </div>

    <div class="sep"></div>
    <div class="group" id="grpAlign">
      <span class="tag">整列</span>
      <button data-align="left"    title="左端をそろえる">左</button>
      <button data-align="hcenter" title="左右の中心をそろえる">左右中央</button>
      <button data-align="right"   title="右端をそろえる">右</button>
      <button data-align="top"     title="上端をそろえる">上</button>
      <button data-align="vcenter" title="上下の中心をそろえる">上下中央</button>
      <button data-align="bottom"  title="下端をそろえる">下</button>
      <button data-dist="h" title="横方向の間隔を等しくする（3個以上）">横に等間隔</button>
      <button data-dist="v" title="縦方向の間隔を等しくする（3個以上）">縦に等間隔</button>
    </div>

    <div class="sep"></div>
    <div class="group" id="grpOrder">
      <span class="tag">重なり</span>
      <button id="btnBack">最背面</button>
      <button id="btnDown">背面へ</button>
      <button id="btnUp">前面へ</button>
      <button id="btnFront">最前面</button>
    </div>

    <div class="group" id="grpEdit">
      <button id="btnLabel">文字を追加</button>
      <button id="btnDup">複製<span class="k">^D</span></button>
      <button id="btnDel">削除<span class="k">Del</span></button>
    </div>
  </div>
  </div>

  <div id="status">
    <div class="cell" id="stZoom">100%</div>
    <div class="cell" id="stCount">0 個</div>
    <div class="cell" id="stFile"></div>
    <div class="cell" id="stEnv"></div>
    <div class="cell" id="stBackup"></div>
    <div class="cell hint" id="stHint">ダブルクリックで文字入力／Space+ドラッグで移動／Ctrl+ホイールで拡大縮小</div>
  </div>

</div>

<input type="file" id="filePicker" accept=".json,application/json" style="display:none">

<script>
"use strict";
(function () {

/* ══════════════════════════════════════════════
   0. 環境判定
   ══════════════════════════════════════════════ */
var ENV = {
  scheme: location.protocol,
  canPickSave: typeof window.showSaveFilePicker === "function",
  canPickOpen: typeof window.showOpenFilePicker === "function"
};

/* ══════════════════════════════════════════════
   1. 定数と状態
   ══════════════════════════════════════════════ */
var FONT_STACK = 'system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif';
var LINE_H = 1.5, NOTE_PAD = 12, MIN_S = 0.1, MAX_S = 8;
var grid = { size:24, snap:false };
/** グリッド吸着が有効なら、値をいちばん近い格子点に丸める */
function sv(v) { return (grid.snap && grid.size > 0) ? Math.round(v / grid.size) * grid.size : v; }

/* ── 配色テーマ ────────────────────────────
   inks / fills は 6 色ずつで、テーマ間で同じ順番に対応させている。
   切り替えたときは、この対応にしたがって既存図形の色を置き換える。 */
var THEMES = {
  forest: {
    name:"深緑",
    c900:"#151d1c", c800:"#1d2827", c700:"#2a3836", cfg:"#e6ecea",
    paper:"#f6f7f5", grid:"#c9d2ce", accent:"#1f6f63", accentSoft:"#e2efeb", guide:"#c2306b",
    frameStroke:"#8a9a96", frameLabel:"#6b7a77", shapeStroke:"rgba(0,0,0,.10)", handleFill:"#ffffff",
    inks: ["#151d1c", "#1f6f63", "#1f4e8c", "#a2560f", "#a3204a", "#5b6a68"],
    fills:["none", "#fdf3c9", "#e2efeb", "#e6edf7", "#f7e6ea", "#ffffff"]
  },
  dark: {
    name:"ダーク",
    c900:"#111214", c800:"#17181b", c700:"#232529", cfg:"#e8ecef",
    paper:"#1e2124", grid:"#33383d", accent:"#6fb3a5", accentSoft:"#2b4a44", guide:"#ff6b9d",
    frameStroke:"#5d666c", frameLabel:"#8b959b", shapeStroke:"rgba(255,255,255,.14)", handleFill:"#1e2124",
    inks: ["#e8ecef", "#6fb3a5", "#7fa9e8", "#e0a15c", "#e8809f", "#9aa5ab"],
    fills:["none", "#4a4526", "#2b4a44", "#2a3a52", "#4a2c38", "#2e3236"]
  },
  blueprint: {
    name:"製図",
    c900:"#0a1526", c800:"#0e1c33", c700:"#16294a", cfg:"#dce9ff",
    paper:"#12294d", grid:"#2a4a7a", accent:"#7fb3ff", accentSoft:"#1e3c68", guide:"#ffcb47",
    frameStroke:"#5b82bd", frameLabel:"#8fb0dd", shapeStroke:"rgba(255,255,255,.18)", handleFill:"#12294d",
    inks: ["#eaf2ff", "#7fb3ff", "#9ee6ff", "#ffcb47", "#ff9db0", "#a8bcd8"],
    fills:["none", "#1d3a63", "#16324f", "#1e3c68", "#3f2f5c", "#0f2340"]
  },
  washi: {
    name:"和紙",
    c900:"#221e19", c800:"#2b2621", c700:"#3a332b", cfg:"#efe7d8",
    paper:"#f4ede0", grid:"#ddd2bd", accent:"#9a6b3f", accentSoft:"#eadfc8", guide:"#b5482f",
    frameStroke:"#a89880", frameLabel:"#8a7a63", shapeStroke:"rgba(0,0,0,.12)", handleFill:"#fdfaf3",
    inks: ["#2f2a24", "#6b5334", "#3d5468", "#a35a1e", "#8d2f3f", "#7a7266"],
    fills:["none", "#f7e6c4", "#eadfc8", "#e2e6dd", "#f2ddd8", "#fdfaf3"]
  }
};
var themeId = "forest";
var TH = THEMES.forest;
var INKS  = TH.inks.slice();
var FILLS = TH.fills.slice();
var PAPER = TH.paper;

var layerSeq = 0;
function newLayer(name) {
  layerSeq += 1;
  return { id:"L" + Date.now().toString(36) + "_" + layerSeq, name:name, visible:true, locked:false };
}
var doc = { format:"whiteboard-json", version:4, layers:[newLayer("レイヤー1")], shapes:[] };
var currentLayer = doc.layers[0].id;
var cam = { x:-80, y:-60, s:1 };
var sel = [];
var tool = "select";
var style = { size:18, color:INKS[0], fill:FILLS[1], width:2.5, arrow:"end" };
var past = [], future = [], clip = [];
var dirty = false, fileHandle = null, fileName = "board.json";
var seq = 0;

var els = {
  wrap:document.getElementById("wrap"),
  scene:document.getElementById("scene"),
  world:document.getElementById("world"),
  selLayer:document.getElementById("sel"),
  anchorLayer:document.getElementById("anchors"),
  guideLayer:document.getElementById("guides"),
  editor:document.getElementById("editor"),
  picker:document.getElementById("filePicker")
};
var measureCtx = document.createElement("canvas").getContext("2d");
var SVGNS = "http://www.w3.org/2000/svg";
var XLINK = "http://www.w3.org/1999/xlink";

/* ══════════════════════════════════════════════
   2. 座標変換
   ══════════════════════════════════════════════ */
function toWorld(cx, cy) {
  var r = els.wrap.getBoundingClientRect();
  return { x:(cx - r.left) / cam.s + cam.x, y:(cy - r.top) / cam.s + cam.y };
}
function toScreen(wx, wy) { return { x:(wx - cam.x) * cam.s, y:(wy - cam.y) * cam.s }; }
function zoomAt(cx, cy, f) {
  var b = toWorld(cx, cy);
  cam.s = Math.min(MAX_S, Math.max(MIN_S, cam.s * f));
  var a = toWorld(cx, cy);
  cam.x += b.x - a.x; cam.y += b.y - a.y;
  applyCamera();
}
function zoomCenter(f) {
  var r = els.wrap.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, f);
}

/* ══════════════════════════════════════════════
   3. オブジェクトモデル
   ══════════════════════════════════════════════ */
function uid() { seq += 1; return "s" + Date.now().toString(36) + "_" + seq; }
function layerById(id) {
  for (var i = 0; i < doc.layers.length; i++) if (doc.layers[i].id === id) return doc.layers[i];
  return null;
}
function layerOf(sh) { return layerById(sh.layer) || doc.layers[0]; }
function layerVisible(sh) { var L = layerOf(sh); return !L || L.visible; }
function layerEditable(sh) { var L = layerOf(sh); return !L || (L.visible && !L.locked); }
/**
 * レイヤー順に並べ替えた図形の一覧。
 * doc.shapes 内の並び（＝レイヤー内での重なり順）は安定ソートで保たれる。
 */
function orderedShapes() {
  var idx = Object.create(null);
  for (var i = 0; i < doc.layers.length; i++) idx[doc.layers[i].id] = i;
  return doc.shapes.slice().sort(function (a, b) {
    return (idx[a.layer] == null ? 0 : idx[a.layer]) - (idx[b.layer] == null ? 0 : idx[b.layer]);
  });
}
function visibleShapes() { return orderedShapes().filter(layerVisible); }
function byId(id) { for (var i = 0; i < doc.shapes.length; i++) if (doc.shapes[i].id === id) return doc.shapes[i]; return null; }
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function selected() { return sel.map(byId).filter(Boolean); }

function makeText(x, y) { return { id:uid(), type:"text", x:x, y:y, w:280, text:"", size:style.size, color:style.color , layer:currentLayer }; }
function makeNote(x, y) { return { id:uid(), type:"note", x:x, y:y, w:200, h:150, text:"", size:style.size, color:INKS[0], fill:style.fill === "none" ? FILLS[1] : style.fill , layer:currentLayer }; }
function makeRect(x, y) { return { id:uid(), type:"rect", x:x, y:y, w:1, h:1, color:style.color, fill:style.fill, width:style.width , layer:currentLayer }; }
function makeImage(x, y, w, h, src) { return { id:uid(), type:"image", x:x, y:y, w:w, h:h, src:src , layer:currentLayer }; }
function makeStroke() { return { id:uid(), type:"stroke", points:[], color:style.color, width:style.width , layer:currentLayer }; }
function makeLine(x, y, arrow) {
  return { id:uid(), type:"line", x1:x, y1:y, x2:x, y2:y, color:style.color, width:style.width, arrow:arrow, layer:currentLayer };
}
function makeFrame(x, y) {
  frameSeq += 1;
  return { id:uid(), type:"frame", x:x, y:y, w:1, h:1, name:"フレーム" + frameSeq, layer:currentLayer };
}
var frameSeq = 0;
function headSize(sh) { return sh.width * 4 + 5; }

function bbox(sh) {
  if (sh.type === "text") return { x:sh.x, y:sh.y, w:sh.w, h:textHeight(sh) };
  if (sh.type === "note") return { x:sh.x, y:sh.y, w:sh.w, h:noteHeight(sh) };
  if (sh.type === "line") {
    var lp = sh.width / 2 + (sh.arrow === "none" ? 2 : headSize(sh));
    return { x:Math.min(sh.x1, sh.x2) - lp, y:Math.min(sh.y1, sh.y2) - lp,
             w:Math.abs(sh.x2 - sh.x1) + lp * 2, h:Math.abs(sh.y2 - sh.y1) + lp * 2 };
  }
  if (sh.type === "stroke") {
    var pad = sh.width / 2 + 2, p = sh.points;
    var x0 = p[0].x, y0 = p[0].y, x1 = p[0].x, y1 = p[0].y;
    for (var i = 1; i < p.length; i++) {
      if (p[i].x < x0) x0 = p[i].x; if (p[i].x > x1) x1 = p[i].x;
      if (p[i].y < y0) y0 = p[i].y; if (p[i].y > y1) y1 = p[i].y;
    }
    return { x:x0 - pad, y:y0 - pad, w:x1 - x0 + pad * 2, h:y1 - y0 + pad * 2 };
  }
  return { x:sh.x, y:sh.y, w:sh.w, h:sh.h };
}
function unionBox(list) {
  if (!list.length) return null;
  var b = bbox(list[0]), x0 = b.x, y0 = b.y, x1 = b.x + b.w, y1 = b.y + b.h;
  for (var i = 1; i < list.length; i++) {
    var c = bbox(list[i]);
    if (c.x < x0) x0 = c.x; if (c.y < y0) y0 = c.y;
    if (c.x + c.w > x1) x1 = c.x + c.w; if (c.y + c.h > y1) y1 = c.y + c.h;
  }
  return { x:x0, y:y0, w:x1 - x0, h:y1 - y0 };
}
function moveShape(sh, dx, dy, snap) {
  if (sh.type === "line") {
    sh.x1 = (snap ? snap.x1 : sh.x1) + dx; sh.y1 = (snap ? snap.y1 : sh.y1) + dy;
    sh.x2 = (snap ? snap.x2 : sh.x2) + dx; sh.y2 = (snap ? snap.y2 : sh.y2) + dy;
    return;
  }
  if (sh.type === "stroke") {
    for (var i = 0; i < sh.points.length; i++) {
      sh.points[i].x = (snap ? snap.points[i].x : sh.points[i].x) + dx;
      sh.points[i].y = (snap ? snap.points[i].y : sh.points[i].y) + dy;
    }
  } else {
    sh.x = (snap ? snap.x : sh.x) + dx;
    sh.y = (snap ? snap.y : sh.y) + dy;
  }
}

/* ── 文字の折り返し ─────────────────────── */
function tokenize(line) {
  var out = [], buf = "";
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (/[0-9A-Za-z@._'"-]/.test(ch)) buf += ch;
    else { if (buf) { out.push(buf); buf = ""; } out.push(ch); }
  }
  if (buf) out.push(buf);
  return out;
}
function wrapText(text, size, maxW) {
  measureCtx.font = size + "px " + FONT_STACK;
  var lines = [], raw = String(text == null ? "" : text).split("\n");
  for (var r = 0; r < raw.length; r++) {
    var tk = tokenize(raw[r]), cur = "";
    for (var t = 0; t < tk.length; t++) {
      var next = cur + tk[t];
      if (cur !== "" && measureCtx.measureText(next).width > maxW) {
        lines.push(cur);
        cur = (tk[t] === " ") ? "" : tk[t];
      } else cur = next;
    }
    lines.push(cur);
  }
  return lines;
}
function textHeight(sh) {
  var lines = wrapText(sh.text || " ", sh.size, sh.w);
  return Math.max(sh.size * LINE_H, lines.length * sh.size * LINE_H);
}
/** 付箋は指定した高さを下限とし、文字が入りきらないぶんだけ下に伸びる */
function noteHeight(sh) {
  var lines = wrapText(sh.text || " ", sh.size, Math.max(1, sh.w - NOTE_PAD * 2));
  return Math.max(sh.h, lines.length * sh.size * LINE_H + NOTE_PAD * 2);
}
/**
 * 文字図形の「実際に文字がある範囲」を行ごとの矩形で返す。
 * 折り返し幅いっぱいの矩形で当たり判定すると、文字のない空白部分まで
 * クリックを奪ってしまうため、判定にはこちらを使う。
 */
function textLineBoxes(sh) {
  var lines = wrapText(sh.text, sh.size, sh.w);
  measureCtx.font = sh.size + "px " + FONT_STACK;
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var lw = measureCtx.measureText(lines[i]).width;
    out.push({
      x:sh.x, y:sh.y + sh.size * LINE_H * i,
      w:Math.max(sh.size * 0.4, lw), h:sh.size * LINE_H
    });
  }
  return out;
}

/* ══════════════════════════════════════════════
   4. Undo / Redo（図形配列のスナップショット方式）
   ══════════════════════════════════════════════ */
function snapshot() {
  return { shapes:clone(doc.shapes), theme:themeId, layers:clone(doc.layers), current:currentLayer };
}
/** 履歴から状態を戻す。テーマも一緒に記録しているので配色も元に戻る */
function restoreState(st) {
  doc.shapes = st.shapes;
  if (st.layers) doc.layers = st.layers;
  if (st.current && layerById(st.current)) currentLayer = st.current;
  else if (doc.layers.length) currentLayer = doc.layers[doc.layers.length - 1].id;
  if (st.theme && st.theme !== themeId) applyThemeById(st.theme, false);
  renderLayerList();
}
function pushSnapshot(snap) {
  past.push(snap);
  if (past.length > 80) past.shift();
  future.length = 0;
  markDirty(true); syncHistoryButtons();
}
function pushHistory() { pushSnapshot(snapshot()); }
function undo() {
  if (!past.length) return;
  commitEdit();
  future.push(snapshot());
  restoreState(past.pop());
  pruneSelection(); markDirty(true); syncHistoryButtons(); render();
}
function redo() {
  if (!future.length) return;
  commitEdit();
  past.push(snapshot());
  restoreState(future.pop());
  pruneSelection(); markDirty(true); syncHistoryButtons(); render();
}
function pruneSelection() { sel = sel.filter(function (id) { return !!byId(id); }); }
function syncHistoryButtons() {
  document.getElementById("btnUndo").disabled = !past.length;
  document.getElementById("btnRedo").disabled = !future.length;
}

/* ══════════════════════════════════════════════
   5. 描画（すべて SVG。手書きも <path> として同じ重なり順に載る）
   ══════════════════════════════════════════════ */
var nodes = Object.create(null);

function svg(name, attrs) {
  var el = document.createElementNS(SVGNS, name);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function applyCamera() {
  els.world.setAttribute("transform",
    "translate(" + (-cam.x * cam.s) + "," + (-cam.y * cam.s) + ") scale(" + cam.s + ")");
  if (grid.size > 0) {
    var g = grid.size * cam.s;
    els.wrap.style.backgroundImage = "";
    els.wrap.style.backgroundSize = g + "px " + g + "px";
    els.wrap.style.backgroundPosition =
      (((-cam.x * cam.s) % g + g) % g) + "px " + (((-cam.y * cam.s) % g + g) % g) + "px";
  } else {
    els.wrap.style.backgroundImage = "none";
  }
  drawSelection();
  if (editing) placeEditor();
  document.getElementById("stZoom").textContent = Math.round(cam.s * 100) + "%";
}
function render() {
  syncLines();
  syncScene(); drawSelection();
  var hidden = doc.shapes.length - visibleShapes().length;
  document.getElementById("stCount").textContent =
    doc.shapes.length + " 個" + (hidden ? "（非表示 " + hidden + "）" : "");
}

function syncScene() {
  var seen = Object.create(null);
  var list = visibleShapes();          // 非表示レイヤーの図形は描かない
  for (var i = 0; i < list.length; i++) {
    var sh = list[i];
    var node = nodes[sh.id] || (nodes[sh.id] = createNode(sh));
    updateNode(node, sh);
    els.world.appendChild(node);          // 配列順＝重なり順
    seen[sh.id] = true;
  }
  for (var id in nodes) if (!seen[id]) { nodes[id].remove(); delete nodes[id]; }
}
function createNode(sh) {
  var g = svg("g", { "class":"hit", "data-id":sh.id });
  if (sh.type === "note") { g.appendChild(svg("rect", { "class":"bg", rx:3 })); g.appendChild(svg("text", { "class":"tx" })); }
  else if (sh.type === "text") { g.appendChild(svg("rect", { "class":"bg", fill:"transparent" })); g.appendChild(svg("text", { "class":"tx" })); }
  else if (sh.type === "rect") { g.appendChild(svg("rect", { "class":"bg", rx:2 })); g.appendChild(svg("text", { "class":"lb" })); }
  else if (sh.type === "image") { g.appendChild(svg("image", { "class":"bg", preserveAspectRatio:"none" })); g.appendChild(svg("text", { "class":"lb" })); }
  else if (sh.type === "stroke") {
    g.appendChild(svg("path", { "class":"bg", fill:"none", "stroke-linecap":"round", "stroke-linejoin":"round" }));
    g.appendChild(svg("text", { "class":"lb" }));
  }
  else if (sh.type === "line") {
    g.appendChild(svg("path", { "class":"bg", fill:"none", "stroke-linecap":"round" }));
    // 矢じりは marker を使わず塗りつぶしパスで描く（書き出した SVG や PNG でも同じに出るため）
    g.appendChild(svg("path", { "class":"ah", stroke:"none" }));
    g.appendChild(svg("text", { "class":"lb" }));
  }
  else if (sh.type === "frame") {
    g.appendChild(svg("rect", { "class":"bg", fill:"none", "stroke-dasharray":"6 4" }));
    g.appendChild(svg("text", { "class":"fl" }));
    g.appendChild(svg("text", { "class":"lb" }));
  }
  return g;
}
function pathD(sh) {
  var p = sh.points, d = "M" + r2(p[0].x) + " " + r2(p[0].y);
  if (p.length === 1) return d + "l0.01 0";
  for (var i = 1; i < p.length; i++) d += "L" + r2(p[i].x) + " " + r2(p[i].y);
  return d;
}
function r2(v) { return Math.round(v * 100) / 100; }
function headPath(fromX, fromY, tipX, tipY, size) {
  var a = Math.atan2(tipY - fromY, tipX - fromX);
  var a1 = a + Math.PI - 0.42, a2 = a + Math.PI + 0.42;
  return "M" + r2(tipX) + " " + r2(tipY) +
         "L" + r2(tipX + Math.cos(a1) * size) + " " + r2(tipY + Math.sin(a1) * size) +
         "L" + r2(tipX + Math.cos(a2) * size) + " " + r2(tipY + Math.sin(a2) * size) + "Z";
}

/**
 * 図形に付いた文字（ラベル）を、外接矩形の中央にそろえて描く。
 * 図形を動かしても大きさを変えても、外接矩形から計算するので自然に追従する。
 * 線や画像の上でも読めるよう、紙色の縁取りを文字の下に敷く。
 */
function updateLabel(g, sh) {
  var lb = g.querySelector(".lb");
  if (!lb) return;
  var txt = sh.label || "";
  if (!txt || (editing && editing.id === sh.id && editField === "label")) { lb.style.display = "none"; return; }
  lb.style.display = "";
  var size = sh.labelSize || 18;
  var b = bbox(sh);
  var lines = wrapText(txt, size, Math.max(40, b.w - 8));
  var total = lines.length * size * LINE_H;
  var cx = b.x + b.w / 2, top = b.y + b.h / 2 - total / 2;
  lb.setAttribute("font-family", FONT_STACK);
  lb.setAttribute("font-size", size);
  lb.setAttribute("text-anchor", "middle");
  lb.setAttribute("fill", INKS[0]);
  lb.setAttribute("stroke", PAPER);   // 紙色の縁取りで下地から浮かせる
  lb.setAttribute("stroke-width", 3.5);
  lb.setAttribute("stroke-linejoin", "round");
  lb.setAttribute("paint-order", "stroke");
  lb.setAttribute("xml:space", "preserve");
  while (lb.firstChild) lb.removeChild(lb.firstChild);
  for (var i = 0; i < lines.length; i++) {
    var ts = svg("tspan", { x:cx, y:top + size * LINE_H * i + (size * LINE_H - size) / 2 + size * 0.82 });
    ts.textContent = lines[i] === "" ? " " : lines[i];
    lb.appendChild(ts);
  }
}

function updateNode(g, sh) {
  var bg = g.querySelector(".bg"), tx = g.querySelector(".tx");
  updateLabel(g, sh);

  if (sh.type === "stroke") {
    bg.setAttribute("d", pathD(sh));
    bg.setAttribute("stroke", sh.color);
    bg.setAttribute("stroke-width", sh.width);
    return;
  }
  if (sh.type === "line") {
    bg.setAttribute("d", "M" + r2(sh.x1) + " " + r2(sh.y1) + "L" + r2(sh.x2) + " " + r2(sh.y2));
    bg.setAttribute("stroke", sh.color);
    bg.setAttribute("stroke-width", sh.width);
    var ah = g.querySelector(".ah"), hd = "";
    if (sh.arrow === "end" || sh.arrow === "both") hd += headPath(sh.x1, sh.y1, sh.x2, sh.y2, headSize(sh));
    if (sh.arrow === "both") hd += headPath(sh.x2, sh.y2, sh.x1, sh.y1, headSize(sh));
    ah.setAttribute("d", hd);
    ah.setAttribute("fill", hd ? sh.color : "none");
    return;
  }
  if (sh.type === "frame") {
    bg.setAttribute("x", sh.x); bg.setAttribute("y", sh.y);
    bg.setAttribute("width", Math.max(1, sh.w)); bg.setAttribute("height", Math.max(1, sh.h));
    bg.setAttribute("stroke", TH.frameStroke); bg.setAttribute("stroke-width", 1.5);
    var fl = g.querySelector(".fl");
    fl.style.display = (editing && editing.id === sh.id && editField === "name") ? "none" : "";
    fl.setAttribute("x", sh.x); fl.setAttribute("y", sh.y - 7);
    fl.setAttribute("font-family", FONT_STACK); fl.setAttribute("font-size", 13);
    fl.setAttribute("fill", TH.frameLabel);
    fl.textContent = sh.name;
    return;
  }

  var b = bbox(sh);
  bg.setAttribute("x", b.x); bg.setAttribute("y", b.y);
  bg.setAttribute("width", Math.max(1, b.w)); bg.setAttribute("height", Math.max(1, b.h));

  if (sh.type === "note") {
    bg.setAttribute("fill", sh.fill);
    bg.setAttribute("stroke", TH.shapeStroke);
    bg.setAttribute("stroke-width", 1);
  } else if (sh.type === "rect") {
    bg.setAttribute("fill", sh.fill || "none");
    bg.setAttribute("stroke", sh.color);
    bg.setAttribute("stroke-width", sh.width);
  } else if (sh.type === "image") {
    if (bg.getAttribute("href") !== sh.src) {
      bg.setAttribute("href", sh.src);
      bg.setAttributeNS(XLINK, "xlink:href", sh.src);   // 書き出した SVG を <img> で読む場合に必要
    }
  }

  if (tx) {
    tx.style.display = (editing && editing.id === sh.id && editField === "text") ? "none" : "";
    var innerW = sh.type === "note" ? sh.w - NOTE_PAD * 2 : sh.w;
    var x0 = sh.type === "note" ? sh.x + NOTE_PAD : sh.x;
    var y0 = sh.type === "note" ? sh.y + NOTE_PAD : sh.y;
    var lines = wrapText(sh.text, sh.size, innerW);
    tx.setAttribute("font-family", FONT_STACK);
    tx.setAttribute("font-size", sh.size);
    tx.setAttribute("fill", sh.color || INKS[0]);
    tx.setAttribute("xml:space", "preserve");
    while (tx.firstChild) tx.removeChild(tx.firstChild);
    for (var i = 0; i < lines.length; i++) {
      // textarea の行ボックス（高さ size×LINE_H、上下均等の余白）と揃うよう自前計算する
      var ts = svg("tspan", { x:x0, y:y0 + sh.size * LINE_H * i + (sh.size * LINE_H - sh.size) / 2 + sh.size * 0.82 });
      ts.textContent = lines[i] === "" ? " " : lines[i];
      tx.appendChild(ts);
    }
  }
}

/* ══════════════════════════════════════════════
   5b. 接続点（中心と各辺の中点）
   ── 直線・矢印の端点をここに吸着させ、図形との結びつきを保持する。
      結びついた端点は、図形を動かしたり大きさを変えても追従する。
   ══════════════════════════════════════════════ */
var ANCHOR_KEYS = ["c", "n", "s", "w", "e"];
function anchorsOf(sh) {
  if (sh.type === "line" || sh.type === "stroke") return [];
  var b = bbox(sh);
  return [
    { k:"c", x:b.x + b.w / 2, y:b.y + b.h / 2 },
    { k:"n", x:b.x + b.w / 2, y:b.y },
    { k:"s", x:b.x + b.w / 2, y:b.y + b.h },
    { k:"w", x:b.x,           y:b.y + b.h / 2 },
    { k:"e", x:b.x + b.w,     y:b.y + b.h / 2 }
  ];
}
function anchorPoint(id, k) {
  var sh = byId(id);
  if (!sh) return null;
  var list = anchorsOf(sh);
  for (var i = 0; i < list.length; i++) if (list[i].k === k) return list[i];
  return null;
}
/** 指定座標にいちばん近い接続点を返す（吸着範囲は画面上で一定になるよう倍率で割る） */
function findAnchor(wx, wy, excludeId) {
  var best = null, th = 14 / cam.s;
  var vis = visibleShapes();
  for (var i = vis.length - 1; i >= 0; i--) {
    var sh = vis[i];
    if (sh.id === excludeId) continue;
    var list = anchorsOf(sh);
    for (var j = 0; j < list.length; j++) {
      var d = Math.hypot(list[j].x - wx, list[j].y - wy);
      if (d <= th && (!best || d < best.d)) {
        best = { id:sh.id, k:list[j].k, x:list[j].x, y:list[j].y, d:d };
      }
    }
  }
  return best;
}
/** 結びついた端点の座標を、つながっている図形に合わせて更新する */
function syncLines() {
  for (var i = 0; i < doc.shapes.length; i++) {
    var sh = doc.shapes[i];

  if (wx == null) return;
  var near = (nearPx == null ? 40 : nearPx) / cam.s, hit = findAnchor(wx, wy, excludeId);
  var vis = visibleShapes();
  for (var i = 0; i < vis.length; i++) {

/* ══════════════════════════════════════════════
   5c. 位置ぞろえガイドと等間隔ガイド
   ── 移動中に他の図形と端・中心がそろう位置、および間隔が等しくなる位置を
      探して吸着させ、根拠となる線を表示する。
      判定のしきい値は画面上で一定になるよう倍率で割る。
   ══════════════════════════════════════════════ */
var GUIDE_PX = 6;

  for (var i = 0; i < list.length; i++) {

function edgesV(b) { return [b.x, b.x + b.w / 2, b.x + b.w]; }

/**
 * 等間隔になる位置を探す。
 * ・左右（上下）に相手がいるなら、その真ん中で間隔を等しくする
 * ・同じ側に 2 つ並んでいるなら、その間隔をそのまま延長する
 */

  var horiz = axis === "x";
  var list = others.filter(function (o) { return horiz ? overlapsY(box, o.b) : overlapsX(box, o.b); });
  var lo = horiz ? box.x : box.y, size = horiz ? box.w : box.h;
  var S = function (b) { return horiz ? b.x : b.y; };
  var E = function (b) { return horiz ? b.x + b.w : b.y + b.h; };

  var before = list.filter(function (o) { return E(o.b) <= lo + th; })
                   .sort(function (a, b) { return E(b.b) - E(a.b); });
  var after  = list.filter(function (o) { return S(o.b) >= lo + size - th; })
                   .sort(function (a, b) { return S(a.b) - S(b.b); });

  var cands = [];

    cands.push({ d:want - lo, pair:[before[0], after[0]], mode:"between" });
  }
  if (before[0] && before[1]) {

    if (g1 > 0.5) cands.push({ d:E(before[0].b) + g1 - lo, pair:[before[1], before[0]], mode:"left" });

  }

  var boxes = [best.pair[0].b, best.pair[1].b, nb].sort(function (a, b) { return S(a) - S(b); });

    } else {

/** 移動後の候補矩形を受け取り、吸着量と表示すべきガイドを返す */

  for (var i = 0; i < others.length; i++) {
    var ov = edgesV(others[i].b), oh = edgesH(others[i].b);
    for (var a = 0; a < 3; a++) {
      for (var b = 0; b < 3; b++) {
        if (allowX) {
          var d1 = ov[b] - mv[a];
          if (Math.abs(d1) <= th && (!bv || Math.abs(d1) < Math.abs(bv.d))) bv = { d:d1, pos:ov[b] };
        }
        if (allowY) {

      if (Math.abs(e[0] - bv.pos) < 0.01 || Math.abs(e[1] - bv.pos) < 0.01 || Math.abs(e[2] - bv.pos) < 0.01) {

        x0 = Math.min(x0, others[n2].b.x); x1 = Math.max(x1, others[n2].b.x + others[n2].b.w);
      }

/** ひとつの辺の位置を、他図形の辺・中心にそろえる */
function snapAxis(v, others, axis, th) {

  for (var i = 0; i < others.length; i++) {
    var e = axis === "v" ? edgesV(others[i].b) : edgesH(others[i].b);

      var d = e[j] - v;

      if (axis === "v") { lo = Math.min(lo, b.y); hi = Math.max(hi, b.y + b.h); }
      else { lo = Math.min(lo, b.x); hi = Math.max(hi, b.x + b.w); }

   6. 書式パネル

/* ══════════════════════════════════════════════
   6b. テーマの適用
   ══════════════════════════════════════════════ */
/**
 * テーマを適用する。remap を true にすると、既存図形の色を
 * 「同じ並び順の色」へ置き換える（テーマ標準色以外はそのまま残す）。
 */
function applyThemeById(id, remap) {
  var next = THEMES[id];

  var prev = TH;
  // 「次に作る図形の色」は、図形の置き換えの有無にかかわらず必ずテーマに合わせる。
  // 合わせないと、ファイルを開いたあとや Undo のあとに前のテーマの色で作られてしまう。
  if (prev !== next) remapDefaults(prev, next);
  if (remap && prev !== next) remapShapeColors(prev, next);

  themeId = id;
  TH = next;
  INKS = next.inks.slice();
  FILLS = next.fills.slice();
  PAPER = next.paper;
  GUIDE_COLOR = next.guide;

  var r = document.documentElement.style;
  r.setProperty("--ink-900", next.c900);
  r.setProperty("--ink-800", next.c800);
  r.setProperty("--ink-700", next.c700);
  r.setProperty("--chrome-fg", next.cfg);
  r.setProperty("--paper", next.paper);
  r.setProperty("--grid", next.grid);
  r.setProperty("--accent", next.accent);
  r.setProperty("--accent-soft", next.accentSoft);

  document.getElementById("selTheme").value = id;
  applyCamera();

}

function colorMaps(prev, next) {

  for (var i = 0; i < prev.inks.length; i++)  mapC[prev.inks[i]]  = next.inks[i];
  for (var j = 0; j < prev.fills.length; j++) mapF[prev.fills[j]] = next.fills[j];
  return { c:mapC, f:mapF };
}
/** 次に作る図形の既定色をテーマに合わせる */
function remapDefaults(prev, next) {

}

    var sh = doc.shapes[k];

function buildSwatches(host, colors, kind) {

/** 選択内容（または作図ツール）に応じて、意味のある項目だけを出す */

/** 選択中の図形に書式を適用する。選択がなければ次に作る図形の既定値だけ変える。 */

   ══════════════════════════════════════════════ */
var ctxAt = null;                       // メニューを開いた位置（ワールド座標）

  var r = els.wrap.getBoundingClientRect();

  // はみ出すときは内側へ寄せる
  var mw = m.offsetWidth || 140, mh = m.offsetHeight || 220;
  if (x + mw > r.width)  x = Math.max(0, r.width - mw - 4);

}

/** メニューから選んだ種類の図形を、その位置に既定の大きさで作る */

  var x = sv(p.x), y = sv(p.y), made = null;

  else if (kind === "frame") { made = makeFrame(x, y); made.w = 420; made.h = 280; }

/* ══════════════════════════════════════════════

}

document.getElementById("btnLayers").onclick = function () {

};
function moveLayer(dir) {

  var j = i + dir;

document.getElementById("layers").addEventListener("click", function (e) {
  var row = e.target.closest ? e.target.closest("[data-layer]") : null;

document.getElementById("layers").addEventListener("dblclick", function (e) {
  var nm = e.target.closest ? e.target.closest(".lnm") : null;
  if (!nm) return;
  var row = nm.closest("[data-layer]"), L = layerById(row.getAttribute("data-layer"));

/* ══════════════════════════════════════════════
   7. 重なり順・複製・クリップボード
   ══════════════════════════════════════════════ */
/* ── 整列と等間隔配置（表示上の外接矩形を基準にする） ── */
function align(kind) {
  var list = selected();
  if (list.length < 2) return;
  var u = unionBox(list), snap = snapshot();
  for (var i = 0; i < list.length; i++) {
    var b = bbox(list[i]), dx = 0, dy = 0;
    if (kind === "left")    dx = u.x - b.x;
    if (kind === "hcenter") dx = (u.x + u.w / 2) - (b.x + b.w / 2);
    if (kind === "right")   dx = (u.x + u.w) - (b.x + b.w);
    if (kind === "top")     dy = u.y - b.y;
    if (kind === "vcenter") dy = (u.y + u.h / 2) - (b.y + b.h / 2);
    if (kind === "bottom")  dy = (u.y + u.h) - (b.y + b.h);
    if (dx || dy) moveShape(list[i], dx, dy, null);
  }
  pushSnapshot(snap); render();
}
function distribute(axis) {
  var list = selected();
  if (list.length < 3) return;
  var items = list.map(function (sh) { return { s:sh, b:bbox(sh) }; });
  items.sort(function (a, b) { return axis === "h" ? a.b.x - b.b.x : a.b.y - b.b.y; });
  var first = items[0].b, last = items[items.length - 1].b;
  var span = axis === "h" ? (last.x - (first.x + first.w)) : (last.y - (first.y + first.h));
  var inner = 0;
  for (var i = 1; i < items.length - 1; i++) inner += axis === "h" ? items[i].b.w : items[i].b.h;
  var gap = (span - inner) / (items.length - 1);
  var snap = snapshot();
  var cursor = axis === "h" ? first.x + first.w : first.y + first.h;
  for (var j = 1; j < items.length - 1; j++) {
    var pos = cursor + gap, b = items[j].b;
    if (axis === "h") moveShape(items[j].s, pos - b.x, 0, null);
    else moveShape(items[j].s, 0, pos - b.y, null);
    cursor = pos + (axis === "h" ? b.w : b.h);
  }
  pushSnapshot(snap); render();
}
document.getElementById("props").addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest("[data-align]") : null;
  if (a) { align(a.getAttribute("data-align")); return; }
  var dsb = e.target.closest ? e.target.closest("[data-dist]") : null;
  if (dsb && !dsb.disabled) distribute(dsb.getAttribute("data-dist"));
});

function reorder(mode) {
  if (!sel.length) return;
  var snap = snapshot();
  var picked = [], rest = [];
  for (var i = 0; i < doc.shapes.length; i++) {
    (sel.indexOf(doc.shapes[i].id) >= 0 ? picked : rest).push(doc.shapes[i]);
  }
  if (mode === "front") doc.shapes = rest.concat(picked);
  else if (mode === "back") doc.shapes = picked.concat(rest);
  else {
    // 1 段ずつ動かす。前面へは末尾側から、背面へは先頭側から処理して順序を保つ。
    var idx = [];
    for (var j = 0; j < doc.shapes.length; j++) if (sel.indexOf(doc.shapes[j].id) >= 0) idx.push(j);
    if (mode === "up") {
      for (var k = idx.length - 1; k >= 0; k--) {

        if (a < doc.shapes.length - 1 && sel.indexOf(doc.shapes[a + 1].id) < 0) {
          var t = doc.shapes[a]; doc.shapes[a] = doc.shapes[a + 1]; doc.shapes[a + 1] = t;
        }
      }
    } else {
      for (var m = 0; m < idx.length; m++) {

  }

/* ══════════════════════════════════════════════
   8. テキスト編集（IME 対応のため textarea を重ねる）
   ══════════════════════════════════════════════ */
var editing = null, editStartText = null, editSnap = null, composing = false;

function startEdit(sh, selectAll, snapBefore, field) {

  } else {
    var pad = sh.type === "note" ? NOTE_PAD : 0;

  ta.style.top = p.y + "px";

      var o2 = drag.box;
      var x0 = o2.x, y0 = o2.y, x1 = o2.x + o2.w, y1 = o2.y + o2.h;
      if (drag.k.indexOf("w") >= 0) x0 = Math.min(sv(o2.x + ddx), x1 - 24);
      if (drag.k.indexOf("e") >= 0) x1 = Math.max(sv(o2.x + o2.w + ddx), x0 + 24);
      if (drag.k.indexOf("n") >= 0) y0 = Math.min(sv(o2.y + ddy), y1 - 24);
      if (drag.k.indexOf("s") >= 0) y1 = Math.max(sv(o2.y + o2.h + ddy), y0 + 24);

      if (useGuide) {
        var g1 = drag.k.indexOf("w") >= 0 ? snapAxis(x0, oth, "v", gth) : null;
        if (g1 && g1.pos < x1 - 24) x0 = g1.pos; else g1 = null;
        var g2 = drag.k.indexOf("e") >= 0 ? snapAxis(x1, oth, "v", gth) : null;
        if (g2 && g2.pos > x0 + 24) x1 = g2.pos; else g2 = null;
        var g3 = drag.k.indexOf("n") >= 0 ? snapAxis(y0, oth, "h", gth) : null;
        if (g3 && g3.pos < y1 - 24) y0 = g3.pos; else g3 = null;
        var g4 = drag.k.indexOf("s") >= 0 ? snapAxis(y1, oth, "h", gth) : null;
        if (g4 && g4.pos > y0 + 24) y1 = g4.pos; else g4 = null;
        var nbx = { x:x0, y:y0, w:x1 - x0, h:y1 - y0 }, gl = [];
        if (g1) gl.push(axisGuide(x0, "v", nbx, oth));
        if (g2) gl.push(axisGuide(x1, "v", nbx, oth));
        if (g3) gl.push(axisGuide(y0, "h", nbx, oth));
        if (g4) gl.push(axisGuide(y1, "h", nbx, oth));
        drawGuides(gl);
      } else clearGuides();

      sh.x = x0; sh.y = y0; sh.w = x1 - x0; sh.h = y1 - y0;
    }
    render();
    return;
  }
  if (drag.mode === "marquee") {
    var mb = { x:Math.min(drag.ox, w.x), y:Math.min(drag.oy, w.y), w:Math.abs(w.x - drag.ox), h:Math.abs(w.y - drag.oy) };
    sel = drag.base.slice();
    var mlist = visibleShapes();
    for (var k = 0; k < mlist.length; k++) {
      if (!layerEditable(mlist[k])) continue;
      var b = bbox(mlist[k]);
      if (b.x >= mb.x && b.y >= mb.y && b.x + b.w <= mb.x + mb.w && b.y + b.h <= mb.y + mb.h &&
          sel.indexOf(mlist[k].id) < 0) sel.push(mlist[k].id);
    }
    drawSelection();
    var a = toScreen(mb.x, mb.y), c = toScreen(mb.x + mb.w, mb.y + mb.h);
    els.selLayer.appendChild(svg("rect", {
      x:a.x, y:a.y, width:Math.max(0, c.x - a.x), height:Math.max(0, c.y - a.y),
      fill:"none", stroke:TH.accent, "stroke-width":1, "stroke-dasharray":"3 3"
    }));
  }
});

els.wrap.addEventListener("pointerup", function (e) {
  if (!drag) return;
  var mode = drag.mode;
  els.wrap.classList.remove("panning");
  try { els.wrap.releasePointerCapture(e.pointerId); } catch (err) {}

  if (mode === "create") {
    var cs = byId(drag.id), csnap = drag.snap;
    drag = null;
    setTool("select");
    render();
    startEdit(cs, false, csnap);       // mousedown は既に処理済みなのでフォーカスは奪われない
    return;
  }
  if (mode === "draw") { pushSnapshot(drag.snap); sel = [liveStroke.id]; liveStroke = null; }
  clearAnchors();
  clearGuides();
  if (mode === "rpan") {
    // 動かさずに離した＝右クリック。その位置に挿入メニューを出す
    if (!drag.moved) ctxOpen(e.clientX, e.clientY, drag.w0);
    drag = null;
    return;
  }
  if (mode === "connect") {
    var ln = byId(drag.id), srcId = drag.srcId, snapC = drag.snap;
    drag = null;
    if (Math.hypot(ln.x2 - ln.x1, ln.y2 - ln.y1) < 12) {
      // ドラッグせずに離した＝ただのクリック。矢印は作らず、その図形を選択する
      doc.shapes = doc.shapes.filter(function (s) { return s.id !== ln.id; });
      sel = byId(srcId) ? [srcId] : [];
      render();
      return;
    }
    var made = null;
    if (!ln.to) {
      // 既存の図形の上で離したなら、その図形につなぐ（重ねて新規作成しない）
      var over = shapeUnder(ln.x2, ln.y2, [ln.id, srcId]);
      if (over) {
        ln.to = { id:over.id, anchor:nearestAnchorKey(over, ln.x2, ln.y2) };
      } else {
        made = cloneLike(byId(srcId), ln.x2, ln.y2);
        if (made) {
          doc.shapes.push(made);
          ln.to = { id:made.id, anchor:backAnchor(ln.x1, ln.y1, ln.x2, ln.y2) };
        }
      }
    }
    pushSnapshot(snapC);
    sel = [made ? made.id : ln.id];
    render();
    if (made && (made.type === "text" || made.type === "note")) startEdit(made, false);
    return;
  }
  if (mode === "newrect") {
    var r = byId(drag.id);
    var tooSmall = r && (r.type === "line"
      ? Math.hypot(r.x2 - r.x1, r.y2 - r.y1) < 6
      : (r.w < 6 || r.h < 6));
    if (tooSmall) {
      doc.shapes = doc.shapes.filter(function (s) { return s.id !== r.id; });
      if (r.type === "frame") frameSeq -= 1;
    } else { pushSnapshot(drag.snap); sel = [drag.id]; }
    setTool("select");
  }
  if (mode === "move" && (drag.moved || drag.dup)) pushSnapshot(drag.snap);
  if (mode === "resize" && drag.changed) pushSnapshot(drag.snap);
  drag = null;
  render();
});

// 右ドラッグを移動に使うため、キャンバス上ではブラウザのメニューを出さない
els.wrap.addEventListener("contextmenu", function (e) {
  if (!onOverlay(e)) e.preventDefault();
});

els.wrap.addEventListener("dblclick", function (e) {
  if (onOverlay(e)) return;
  var w = toWorld(e.clientX, e.clientY);
  var hit = hitTest(w.x, w.y);
  if (hit && (hit.type === "text" || hit.type === "note")) { startEdit(hit, true); return; }
  if (hit && hit.type === "frame") {
    // フレームは枠線・ラベルの上でしか当たらない。上のラベル付近なら名前を、それ以外は中の文字を編集する
    if (w.y <= hit.y) { sel = [hit.id]; startEdit(hit, true, null, "name"); }
    else { sel = [hit.id]; startEdit(hit, true, null, "label"); }
    return;
  }
  if (hit) { sel = [hit.id]; startEdit(hit, true, null, "label"); return; }
  if (!hit) {
    var snapD = snapshot();
    var t = makeText(w.x, w.y);
    doc.shapes.push(t);
    render();
    startEdit(t, false, snapD);
  }
});

els.wrap.addEventListener("wheel", function (e) {
  if (onOverlay(e)) return;
  ctxClose();
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.pow(0.999, e.deltaY * 2));
  else {
    cam.x += (e.shiftKey ? e.deltaY : e.deltaX) / cam.s;
    cam.y += (e.shiftKey ? 0 : e.deltaY) / cam.s;
    applyCamera();
  }
}, { passive:false });

/* ══════════════════════════════════════════════
   10. 画像の貼り付け
   ══════════════════════════════════════════════ */
window.addEventListener("paste", function (e) {
  if (editing) return;
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf("image/") !== 0) continue;
    var fr = new FileReader();
    fr.onload = function (ev) {
      var img = new Image();
      img.onload = function () {
        var r = els.wrap.getBoundingClientRect();
        var c = toWorld(r.left + r.width / 2, r.top + r.height / 2);
        var k = Math.min(1, 900 / img.width), w = img.width * k, h = img.height * k;
        var snap = snapshot();
        var sh = makeImage(c.x - w / 2, c.y - h / 2, w, h, ev.target.result);
        doc.shapes.push(sh);
        pushSnapshot(snap);
        sel = [sh.id];
        render();
      };
      img.src = ev.target.result;
    };
    fr.readAsDataURL(items[i].getAsFile());
    e.preventDefault();
    return;
  }
});

/* ══════════════════════════════════════════════
   11. 保存・読込・書き出し
   ══════════════════════════════════════════════ */
function serialize() {
  return JSON.stringify({
    format:"whiteboard-json", version:4,
    theme:themeId,
    layers:doc.layers,
    camera:{ x:cam.x, y:cam.y, s:cam.s },
    shapes:doc.shapes
  }, null, 1);
}
function load(json) {
  var data = JSON.parse(json);
  if (!data || !Array.isArray(data.shapes)) throw new Error("図形データが見つかりません");
  commitEdit();
  doc.layers = (data.layers && data.layers.length) ? data.layers : [newLayer("レイヤー1")];
  currentLayer = doc.layers[doc.layers.length - 1].id;
  doc.shapes = data.shapes.map(migrate);
  // レイヤーを持たない旧ファイルの図形は、いちばん下のレイヤーに入れる
  for (var mi = 0; mi < doc.shapes.length; mi++) {
    if (!layerById(doc.shapes[mi].layer)) doc.shapes[mi].layer = doc.layers[0].id;
  }
  renderLayerList();
  applyThemeById(THEMES[data.theme] ? data.theme : "forest", false);   // 記録がなければ既定テーマ
  if (data.camera) cam = { x:data.camera.x, y:data.camera.y, s:data.camera.s || 1 };
  sel = []; past.length = 0; future.length = 0;
  for (var id in nodes) { nodes[id].remove(); delete nodes[id]; }
  syncHistoryButtons(); markDirty(false); applyCamera(); render();
  setEnvNote(fileHandle ? "" : (ENV.canPickSave
    ? "この開き方では上書き先が決まりません。最初の保存で保存先を選んでください"
    : ""));
}
/** 第1段階（version 1）のファイルを読めるようにする */
function migrate(s) {
  if (s.type === "rect") {
    if (s.stroke && !s.color) s.color = s.stroke;
    delete s.stroke;
    if (!s.width) s.width = 1.5;
  }
  if (s.type === "note" && !s.color) s.color = INKS[0];
  return s;
}

function downloadBlob(name, blob) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
function saveAs() {
  commitEdit();
  var text = serialize();
  if (ENV.canPickSave) {
    window.showSaveFilePicker({
      suggestedName:fileName,
      types:[{ description:"ホワイトボード", accept:{ "application/json":[".json"] } }]
    }).then(function (h) { fileHandle = h; fileName = h.name; return writeHandle(text); })
      .catch(function (err) { if (err && err.name !== "AbortError") setEnvNote("保存できませんでした: " + err.message); });
  } else {
    downloadBlob(fileName, new Blob([text], { type:"application/json" }));
    markDirty(false);
  }
}
/**
 * ファイルハンドルへの書き込み許可を確かめる。
 * 「開く」で得たハンドルは読み取り許可しか持たないことがあり、
 * その場合は書き込み許可を求めないと createWritable が失敗する。
 * 求める操作はユーザーの操作（クリックやキー入力）の直後でなければならない。
 */
function ensureWritable(handle) {
  if (!handle || !handle.queryPermission) return Promise.resolve(true);
  var opts = { mode:"readwrite" };
  return handle.queryPermission(opts).then(function (st) {
    if (st === "granted") return true;
    return handle.requestPermission(opts).then(function (st2) { return st2 === "granted"; });
  }).catch(function () { return false; });
}
function save() {
  commitEdit();
  if (!fileHandle) { saveAs(); return; }        // 上書き先が未確定なら保存先を尋ねる
  var text = serialize();
  ensureWritable(fileHandle).then(function (ok) {
    if (!ok) {
      // 許可が得られなければ、保存先を選び直してもらう
      fileHandle = null;
      setEnvNote("上書きの許可が得られなかったため、保存先を選び直します");
      saveAs();
      return;
    }
    return writeHandle(text);
  });
}
function writeHandle(text) {
  return fileHandle.createWritable()
    .then(function (w) { return w.write(text).then(function () { return w.close(); }); })
    .then(function () { markDirty(false); })
    .catch(function (err) {
      fileHandle = null;
      setEnvNote("上書き保存できませんでした: " + (err && err.message ? err.message : ""));
      markDirty(true);
    });
}
function openFile() {
  commitEdit();
  if (ENV.canPickOpen) {
    window.showOpenFilePicker({ multiple:false })
      .then(function (hs) { fileHandle = hs[0]; fileName = fileHandle.name; return fileHandle.getFile(); })
      .then(function (f) { return f.text(); })
      .then(load)
      .catch(function (err) { if (err && err.name !== "AbortError") setEnvNote("読み込めませんでした: " + err.message); });
  } else { els.picker.value = ""; els.picker.click(); }
}
els.picker.addEventListener("change", function () {
  var f = els.picker.files && els.picker.files[0];
  if (!f) return;
  // <input type="file"> で開いた場合は元のファイルへの書き込み口がない。
  // 以降の保存は「保存先を尋ねる」か「書き出し」になる。
  fileHandle = null;
  fileName = f.name;
  var fr = new FileReader();
  fr.onload = function (e) {
    try { load(e.target.result); } catch (err) { setEnvNote("読み込めませんでした: " + err.message); }
  };
  fr.readAsText(f);
});

/* ── 書き出し（画面ではなく内容の外接矩形を基準にする） ── */
/**
 * 書き出す SVG を組み立てる。
 * scope: "all"=全体 / "sel"=選択範囲 / "frame"=選択中（またはひとつ目）のフレーム
 * フレーム自身の枠線とラベルは出力に含めず、範囲の指定だけに使う。
 */
function buildSVG(scope) {
  commitEdit();
  var content = visibleShapes().filter(function (sh) { return sh.type !== "frame"; });
  var bounds = null, pad = 24, label = "";

  if (scope === "frame") {
    var frames = doc.shapes.filter(function (sh) { return sh.type === "frame"; });
    var picked = frames.filter(function (sh) { return sel.indexOf(sh.id) >= 0; })[0] || frames[0];
    if (!picked) return { error:"フレームがありません" };
    bounds = { x:picked.x, y:picked.y, w:picked.w, h:picked.h };
    pad = 0;
    label = picked.name;
    // フレームに少しでも重なる図形だけを対象にし、はみ出しは切り取る
    content = content.filter(function (sh) {
      var b = bbox(sh);
      return b.x < bounds.x + bounds.w && b.x + b.w > bounds.x &&
             b.y < bounds.y + bounds.h && b.y + b.h > bounds.y;
    });
  } else if (scope === "sel") {
    content = content.filter(function (sh) { return sel.indexOf(sh.id) >= 0; });
    if (!content.length) return { error:"図形が選択されていません" };
    bounds = unionBox(content);
    label = "選択";
  } else {
    if (!content.length) return { error:"書き出す内容がありません" };
    bounds = unionBox(content);
  }

  var x = bounds.x - pad, y = bounds.y - pad, w = bounds.w + pad * 2, h = bounds.h + pad * 2;
  var keep = Object.create(null);
  for (var i = 0; i < content.length; i++) keep[content[i].id] = true;

  var g = els.world.cloneNode(true);
  g.removeAttribute("transform");
  var all = g.querySelectorAll("[data-id]");
  for (var j = 0; j < all.length; j++) {
    if (!keep[all[j].getAttribute("data-id")]) all[j].remove();
  }
  var hidden = g.querySelectorAll('[style*="display: none"]');
  for (var k = 0; k < hidden.length; k++) hidden[k].removeAttribute("style");

  var root = svg("svg", {
    viewBox:r2(x) + " " + r2(y) + " " + r2(w) + " " + r2(h),
    width:Math.round(w), height:Math.round(h)
  });
  root.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:xlink", XLINK);

  if (scope === "frame") {
    // フレームの外にはみ出した部分を切り取る
    var cid = "wbclip";
    var defs = svg("defs", {});
    var cp = svg("clipPath", { id:cid });
    cp.appendChild(svg("rect", { x:x, y:y, width:w, height:h }));
    defs.appendChild(cp);
    root.appendChild(defs);
    g.setAttribute("clip-path", "url(#" + cid + ")");
  }
  root.appendChild(svg("rect", { x:x, y:y, width:w, height:h, fill:PAPER }));
  root.appendChild(g);
  return { text:new XMLSerializer().serializeToString(root), w:w, h:h, label:label };
}
function currentScope() { return document.getElementById("selScope").value; }
function exportName(out, ext) {
  return baseName() + (out.label ? "_" + out.label : "") + "." + ext;
}
function exportSVG() {
  var out = buildSVG(currentScope());
  if (out.error) { setEnvNote(out.error); return; }
  downloadBlob(exportName(out, "svg"), new Blob([out.text], { type:"image/svg+xml" }));
}
function exportPNG() {
  var out = buildSVG(currentScope());
  if (out.error) { setEnvNote(out.error); return; }
  var scale = 2;                                   // 印刷・貼り付け用に 2 倍で出す
  var img = new Image();
  img.onload = function () {
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(out.w * scale));
    cv.height = Math.max(1, Math.round(out.h * scale));
    var c = cv.getContext("2d");
    c.fillStyle = PAPER; c.fillRect(0, 0, cv.width, cv.height);
    c.drawImage(img, 0, 0, cv.width, cv.height);
    try {
      cv.toBlob(function (blob) {
        if (blob) downloadBlob(exportName(out, "png"), blob);
        else setEnvNote("PNG を生成できませんでした");
      }, "image/png");
    } catch (err) {
      setEnvNote("PNG を生成できませんでした: " + err.message);
    }
  };
  img.onerror = function () { setEnvNote("PNG を生成できませんでした（SVG の読み込みに失敗）"); };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(out.text);
}
function baseName() { return String(fileName).replace(/\.[^.]*$/, "") || "board"; }
document.getElementById("btnExportSvg").onclick = exportSVG;
document.getElementById("btnExportPng").onclick = exportPNG;

/* ══════════════════════════════════════════════
   11b. 自動バックアップ
   ── ブラウザ内の専用領域（Origin Private File System）に定期保存する。
      file:// では使えないため、その旨をステータスバーに出す。
      これは保存の代わりではなく、閉じてしまったときの保険。
   ══════════════════════════════════════════════ */
var BACKUP_FILE = "autobackup.json", BACKUP_SEC = 20;
var backup = { dir:null, ready:false, last:null, pending:null };

function backupAvailable() {
  return !!(window.isSecureContext && navigator.storage && navigator.storage.getDirectory);
}
function backupInit() {
  if (!backupAvailable()) { setBackupNote("自動バックアップなし（この環境では使えません）"); return; }
  setBackupNote("自動バックアップ 準備中");
  navigator.storage.getDirectory().then(function (root) {
    backup.dir = root;
    backup.ready = true;
    return root.getFileHandle(BACKUP_FILE, { create:false }).then(function (h) { return h.getFile(); });
  }).then(function (f) {
    if (f && f.size > 40) offerRestore(f);
    else setBackupNote("自動バックアップ 待機中");
  }).catch(function () {
    setBackupNote(backup.ready ? "自動バックアップ 待機中" : "自動バックアップ 使えません");
  }).then(function () {
    if (backup.ready) setInterval(backupWrite, BACKUP_SEC * 1000);
  });
}
function backupWrite() {
  if (!backup.ready || !dirty || editing) return;
  var text = serialize();
  if (text === backup.pending) return;
  backup.pending = text;
  backup.dir.getFileHandle(BACKUP_FILE, { create:true })
    .then(function (h) {
      if (!h.createWritable) throw new Error("書き込み未対応");
      return h.createWritable();
    })
    .then(function (wr) { return wr.write(text).then(function () { return wr.close(); }); })
    .then(function () {
      backup.last = new Date();
      setBackupNote("自動バックアップ " + hhmm(backup.last));
    })
    .catch(function () { backup.ready = false; setBackupNote("自動バックアップ 失敗"); });
}
function offerRestore(file) {
  setBackupNote("自動バックアップ " + hhmm(new Date(file.lastModified)));
  var bar = document.getElementById("restore");
  document.getElementById("restoreWhen").textContent = hhmm(new Date(file.lastModified));
  bar.hidden = false;
  document.getElementById("btnRestore").onclick = function () {
    file.text().then(function (t) {
      try { load(t); fileName = "restored.json"; markDirty(true); bar.hidden = true; }
      catch (err) { setBackupNote("復元できませんでした"); }
    });
  };
  document.getElementById("btnDismiss").onclick = function () { bar.hidden = true; };
}
function hhmm(d) {
  return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function setBackupNote(t) { document.getElementById("stBackup").textContent = t; }

function markDirty(v) {
  dirty = v;
  var mode = fileHandle ? "上書き" : "書き出し";
  document.getElementById("stFile").innerHTML =
    '<span class="dot ' + (v ? "dirty" : "clean") + '"></span>' +
    (v ? "未保存の変更あり" : "保存済み") + " · " + escapeHtml(fileName) +
    ' <span style="opacity:.55">(' + mode + ')</span>';
  document.getElementById("stFile").title = fileHandle
    ? "Ctrl+S でこのファイルに上書きします"
    : "このファイルは上書きできません。Ctrl+S は書き出し（ダウンロード）になります";
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}
window.addEventListener("beforeunload", function (e) {
  if (!dirty) return;
  e.preventDefault(); e.returnValue = "";
});

/* ══════════════════════════════════════════════
   12. ツールとキーボード
   ══════════════════════════════════════════════ */
function setTool(t) {
  tool = t;
  var btns = document.querySelectorAll("[data-tool]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].setAttribute("aria-pressed", String(btns[i].getAttribute("data-tool") === t));
  }
  clearAnchors();
  els.wrap.classList.remove("linking");
  els.wrap.classList.toggle("drawing", t === "pen");
  els.wrap.classList.toggle("placing", t === "text" || t === "note" || t === "rect");
  syncProps();
}
document.getElementById("toolbar").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-tool]") : null;
  if (b) setTool(b.getAttribute("data-tool"));
});
document.getElementById("btnUndo").onclick = undo;
document.getElementById("btnRedo").onclick = redo;
document.getElementById("btnZoomIn").onclick = function () { zoomCenter(1.2); };
document.getElementById("btnZoomOut").onclick = function () { zoomCenter(1 / 1.2); };
document.getElementById("btnZoomReset").onclick = function () { zoomCenter(1 / cam.s); };
document.getElementById("btnFit").onclick = fitAll;
document.getElementById("selGrid").onchange = function () {
  grid.size = parseFloat(this.value);
  if (grid.size <= 0) setSnap(false);
  applyCamera();
};
document.getElementById("btnSnap").onclick = function () { setSnap(!grid.snap); };
document.getElementById("selTheme").onchange = function () {
  var snap = snapshot();
  applyThemeById(this.value, true);
  pushSnapshot(snap);
};
document.getElementById("btnGuide").onclick = function () {
  guideOn = !guideOn;
  this.setAttribute("aria-pressed", String(guideOn));
  if (!guideOn) clearGuides();
};
function setSnap(on) {
  grid.snap = !!on && grid.size > 0;
  document.getElementById("btnSnap").setAttribute("aria-pressed", String(grid.snap));
}
document.getElementById("btnOpen").onclick = openFile;
document.getElementById("btnSave").onclick = save;
document.getElementById("btnSaveAs").onclick = saveAs;

function fitAll() {
  var vis = visibleShapes();
  if (!vis.length) { cam = { x:-80, y:-60, s:1 }; applyCamera(); return; }
  var b = unionBox(vis), r = els.wrap.getBoundingClientRect(), pad = 48;
  cam.s = Math.min(MAX_S, Math.max(MIN_S,
    Math.min((r.width - pad * 2) / Math.max(1, b.w), (r.height - pad * 2) / Math.max(1, b.h))));
  cam.x = b.x + b.w / 2 - r.width / 2 / cam.s;
  cam.y = b.y + b.h / 2 - r.height / 2 / cam.s;
  applyCamera();
}

window.addEventListener("keydown", function (e) {
  // 編集欄や書式パネルの入力部品を操作中は、ショートカットを横取りしない
  var t = e.target, tag = t && t.tagName ? t.tagName : "";
  if (t === els.editor || tag === "SELECT" || tag === "INPUT" || tag === "TEXTAREA") return;
  var mod = e.ctrlKey || e.metaKey;
  var k = e.key.toLowerCase();

  if (e.code === "Space" && !spaceDown) { spaceDown = true; els.wrap.classList.add("pannable"); e.preventDefault(); return; }

  if (mod) {
    if (k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (k === "y") { e.preventDefault(); redo(); return; }
    if (k === "s") { e.preventDefault(); e.shiftKey ? saveAs() : save(); return; }
    if (k === "o") { e.preventDefault(); openFile(); return; }
    if (k === "a") {
      e.preventDefault();
      sel = doc.shapes.filter(layerEditable).map(function (s) { return s.id; });
      drawSelection(); return;
    }
    if (k === "c") { e.preventDefault(); copySel(false); return; }
    if (k === "x") { e.preventDefault(); copySel(true); return; }
    if (k === "d") { e.preventDefault(); duplicate(20); return; }
    if (k === "v") { if (pasteClip()) e.preventDefault(); return; }   // 内部クリップボードが空なら画像貼り付けに任せる
    if (e.key === "]") { e.preventDefault(); reorder(e.shiftKey ? "front" : "up"); return; }
    if (e.key === "[") { e.preventDefault(); reorder(e.shiftKey ? "back" : "down"); return; }
    return;
  }

  if (e.key === "Delete" || e.key === "Backspace") { if (sel.length) { e.preventDefault(); deleteSel(); } return; }
  if (e.key === "Escape") {
    if (ctxIsOpen()) { ctxClose(); return; }
    commitEdit(); sel = []; setTool("select"); drawSelection(); return;
  }
  if (e.key === "Enter" && sel.length === 1) {
    var sh = byId(sel[0]);
    if (!sh) return;
    e.preventDefault();
    if (sh.type === "text" || sh.type === "note") startEdit(sh, true);
    else startEdit(sh, true, null, "label");
    return;
  }
  if (e.key.indexOf("Arrow") === 0 && sel.length) {
    e.preventDefault();
    var step = e.shiftKey ? 10 : 1;
    var dx = (e.key === "ArrowRight" ? step : 0) - (e.key === "ArrowLeft" ? step : 0);
    var dy = (e.key === "ArrowDown" ? step : 0) - (e.key === "ArrowUp" ? step : 0);
    var snap = snapshot(), list = selected();
    for (var i = 0; i < list.length; i++) moveShape(list[i], dx, dy, null);
    pushSnapshot(snap);
    render();
    return;
  }
  var map = { v:"select", t:"text", n:"note", r:"rect", p:"pen", l:"line", a:"arrow", f:"frame" };
  if (map[k]) setTool(map[k]);
});
window.addEventListener("keyup", function (e) {
  if (e.code === "Space") { spaceDown = false; els.wrap.classList.remove("pannable"); }
});
window.addEventListener("blur", function () {
  spaceDown = false; els.wrap.classList.remove("pannable"); ctxClose();
});
window.addEventListener("resize", applyCamera);

/* ══════════════════════════════════════════════
   13. 起動
   ══════════════════════════════════════════════ */
function setEnvNote(extra) {
  var el = document.getElementById("stEnv"), ok = ENV.canPickSave;
  el.innerHTML = '<span class="dot ' + (ok ? "on" : "off") + '"></span>' +
    escapeHtml(ENV.scheme) + " · " + (ok ? "上書き保存 可" : "書き出しのみ") +
    (extra ? " · " + escapeHtml(extra) : "");
  el.title = ok
    ? "File System Access API が使えます。Ctrl+S で同じファイルに上書き保存します。"
    : "この環境では File System Access API が使えないため、保存はダウンロードになります。";
}
setEnvNote("");
renderLayerList();
backupInit();
markDirty(false);
syncHistoryButtons();
applyCamera();
render();
syncProps();

})();
</script>
